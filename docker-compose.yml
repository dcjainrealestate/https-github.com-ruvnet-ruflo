services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: ruflo
      MYSQL_PASSWORD: ruflo_password
      MYSQL_DATABASE: ruflo_resale
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://ruflo:ruflo_password@db:3306/ruflo_resale
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please-change-this-access-secret}
      JWT_TEMP_2FA_SECRET: ${JWT_TEMP_2FA_SECRET:-please-change-this-temp-secret}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-Ruflo Resale Inventory}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Ruflo Resale Inventory <no-reply@ruflo.example.com>}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db_data:
