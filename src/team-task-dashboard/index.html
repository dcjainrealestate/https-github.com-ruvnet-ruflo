    closeModal();
  } catch(e){
    showToast('Could not send the notification — check your connection and try again');
  }
}

/* ---- Resource Request (ask a teammate for something from inside a task) ---- */
function openResourceRequestModal(taskId){ state.modal = { type:'resourceRequest', taskId }; render(); }
function renderResourceRequestModal(taskId){
  const t = DB.tasks.find(x => x.id===taskId);
  if (!t) return '';
  const recipients = visibleEmployees().filter(e => e.active && e.id !== currentUser().id);
  return '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">' +
    '<div class="modal-head"><h3>Request Something From a Teammate</h3><span class="close-x" onclick="closeModal()">'+icon('x',15)+'</span></div>' +
    '<div class="modal-body">' +
      '<div class="sub" style="margin-bottom:10px">Need a file, an approval, info, or anything else from someone to finish <strong>'+escHtml(t.name)+'</strong>? This creates a task for them so it doesn\'t get lost.</div>' +
      '<div class="field-row single"><div class="field-group"><label>Request From</label><select id="rr-recipient" class="field">' +
        (recipients.length ? recipients.map(e => '<option value="'+e.id+'">'+e.name+'</option>').join('') : '<option value="">No other teammates available</option>') +
      '</select></div></div>' +
      '<div class="field-row single"><div class="field-group"><label>What do you need?</label><input id="rr-title" class="field" placeholder="e.g. Signed NOC for Skyline Towers" /></div></div>' +
      '<div class="field-row single"><div class="field-group"><label>Details</label><textarea id="rr-desc" class="field" rows="3" placeholder="Any context that will help them (optional)"></textarea></div></div>' +
      '<div class="field-row">' +
        '<div class="field-group"><label>Needed By</label><input id="rr-due" type="date" class="field" value="'+addDaysISO(todayISO(),3)+'" /></div>' +
        '<div class="field-group"><label>Priority</label><select id="rr-priority" class="field">'+PRIORITIES.map(p=>'<option '+(p==='Medium'?'selected':'')+'>'+p+'</option>').join('')+'</select></div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" '+(recipients.length?'':'disabled')+' onclick="submitResourceRequest(\''+t.id+'\')">'+icon('users',13)+' Send Request</button></div>' +
  '</div></div>';
}
async function submitResourceRequest(taskId){
  const t = DB.tasks.find(x => x.id===taskId);
  if (!t) return;
  const recipientId = document.getElementById('rr-recipient').value;
  if (!recipientId){ showToast('Pick who you need this from'); return; }
  const title = document.getElementById('rr-title').value.trim();
  if (!title){ showToast('Say what you need'); return; }
  const details = document.getElementById('rr-desc').value.trim();
  const due = document.getElementById('rr-due').value || addDaysISO(todayISO(),3);
  const priority = document.getElementById('rr-priority').value;
  const recipient = DB.employees.find(e => e.id===recipientId);
  const note = 'Requested by ' + currentUser().name + ' for task ' + t.id + ' — ' + t.name + '.' + (details ? ('\n\n' + details) : '');
  try {
    const newTask = await DB.addTask({
      name: title, description: note, assignedTo: recipientId, assignedBy: currentUser().id,
      department: recipient.department, project: t.project, createdDate: todayISO(), startDate: todayISO(),
      dueDate: due, priority, level: 1, status: 'Not Started', estimatedHours: null, actualHours: null,
      progress: 0, completionDate: null, completionNotes: '', linkedTaskId: t.id
    });
    DB.addComment(t.id, 'Requested "'+title+'" from '+recipient.name+' (task '+newTask.id+').', currentUser().id, 'request');
    showToast('Request sent to ' + recipient.name);
    state.modal = { type:'taskDetail', taskId: t.id, showCompletionPrompt:false, showRejectPrompt:false };
    render();
  } catch(e){
    showToast('Could not send the request — check your connection and try again');
  }
}

/* ---- Task Form (Create / Edit) ---- */
const TASK_DRAFT_KEY = 'tf_task_draft';
function getTaskDraft(){
  try { const raw = localStorage.getItem(TASK_DRAFT_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function clearTaskDraft(){ try { localStorage.removeItem(TASK_DRAFT_KEY); } catch(e){} }
function captureTaskDraftIfOpen(){
  if (!state.modal || state.modal.type !== 'taskForm' || state.modal.taskId) return; // only for new-task creation, not edits
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const checked = id => { const el = document.getElementById(id); return el ? (el.checked ? '1' : '0') : '0'; };
  const draft = {
    name: val('tf-name'), desc: val('tf-desc'), assignee: val('tf-assignee'), dept: val('tf-dept'),
    project: val('tf-project'), projectOther: val('tf-project-other'), start: val('tf-start'), due: val('tf-due'),
    startTime: val('tf-start-time'), endTime: val('tf-end-time'),
    priority: val('tf-priority'), level: val('tf-level'), status: val('tf-status'), recurrence: val('tf-recurrence'),
    urgent: checked('tf-urgent'), urgentReason: val('tf-urgent-reason'), scheduleType: val('tf-scheduletype')
  };
  try {
    if (draft.name.trim() || draft.desc.trim()) localStorage.setItem(TASK_DRAFT_KEY, JSON.stringify(draft));
    else clearTaskDraft();
  } catch(e){}
}
function cancelTaskForm(){ captureTaskDraftIfOpen(); closeModal(); }
function discardTaskDraft(){ clearTaskDraft(); state.modal = { type:'taskForm', taskId:null }; render(); }

    '</div>' +

}
function updateDueDateFromRecurrence(){

  // won't wipe the rest of the open form (see flagFieldError's note below).
  const recurrence = document.getElementById('tf-recurrence').value;

function flagFieldError(elId, message){
  // Used instead of showToast() for in-form validation failures — showToast
  // triggers a full re-render, which rebuilds this form from the unsaved
  // task/draft and silently discards whatever else the user had typed.
  const el = document.getElementById(elId);
  if (!el) return;
  el.style.borderColor = 'var(--bad)';
  if (message) el.title = message;
  el.focus();
  if (el.scrollIntoView) el.scrollIntoView({ block:'center', behavior:'smooth' });
}
async function saveTaskForm(id){
  const name = document.getElementById('tf-name').value.trim();
  if (!name){ flagFieldError('tf-name', 'Task name is required'); return; }
  const assignee = document.getElementById('tf-assignee').value || null;
  const dept = document.getElementById('tf-dept').value;
  let project = document.getElementById('tf-project').value;
  if (project === 'Other'){
    const custom = document.getElementById('tf-project-other').value.trim();
    if (custom){ DB.addProject(custom); project = custom; }
  }
  const start = document.getElementById('tf-start').value;
  const due = document.getElementById('tf-due').value;
  const startTime = document.getElementById('tf-start-time').value || null;
  const endTime = document.getElementById('tf-end-time').value || null;
  const priority = document.getElementById('tf-priority').value;
  const level = Number(document.getElementById('tf-level').value);
  const status = document.getElementById('tf-status').value;
  const recurrence = document.getElementById('tf-recurrence').value || null;
  const desc = document.getElementById('tf-desc').value.trim();
  const isUrgent = document.getElementById('tf-urgent').checked;
  const urgencyReason = document.getElementById('tf-urgent-reason').value.trim();
  const scheduleType = document.getElementById('tf-scheduletype').value;
  if (!start){ flagFieldError('tf-start', 'Start date is required'); return; }
  if (!due){ flagFieldError('tf-due', 'Due date is required'); return; }
  if (due < start){ flagFieldError('tf-due', 'Due date cannot be before the start date'); return; }
  if (startTime && endTime && endTime <= startTime){ flagFieldError('tf-end-time', 'Work end time must be after the start time'); return; }
  if (isUrgent && !urgencyReason){
    flagFieldError('tf-urgent-reason', 'Required — say why this is urgent');
    document.getElementById('tf-urgent-reason').placeholder = 'Required — say why this is urgent';
    return;
  }

  if (id){
    const cur = DB.tasks.find(x => x.id===id);
    const wasCompleted = cur.status === 'Completed';
    const wasUrgent = cur.isUrgent;
    const completingLate = status === 'Completed' && !wasCompleted && isOverdue(cur);
    let lateReason = '';
    if (completingLate){
      lateReason = document.getElementById('tf-completion-notes').value.trim();
      if (!lateReason){ flagFieldError('tf-completion-notes', 'Required — explain why this task is late'); return; }
    }
    const patch = { name, description:desc, assignedTo:assignee, department:dept, project, startDate:start, dueDate:due, startTime, endTime, priority, level, status, recurrence, isUrgent, urgencyReason, scheduleType };
    if (status === 'Completed' && cur.status !== 'Completed'){ patch.completionDate = new Date().toISOString(); patch.progress = 100; if (completingLate) patch.completionNotes = 'Late — ' + lateReason; }
    else if (status !== 'Completed' && cur.status === 'Completed'){ patch.completionDate = null; patch.progress = 75; }
    DB.updateTask(id, patch);
    if (isUrgent && !wasUrgent) DB.addComment(id, 'Marked as Urgent Work: ' + urgencyReason, currentUser().id, 'urgent');
    if (completingLate) DB.addComment(id, 'Late — ' + lateReason, currentUser().id, 'completion');
    if (status === 'Completed' && !wasCompleted) spawnNextRecurrence(cur);
    showToast('Task updated');
  } else {
    try {
      const created = await DB.addTask({ name, description:desc, assignedTo:assignee, assignedBy:currentUser().id, department:dept, project,
        createdDate:todayISO(), startDate:start, dueDate:due, startTime, endTime, priority, level, status, estimatedHours:null, actualHours:null,
        progress: status==='Completed'?100:0, completionDate: status==='Completed'?new Date().toISOString():null, completionNotes:'', recurrence,
        isUrgent, urgencyReason, scheduleType });
      if (isUrgent) DB.addComment(created.id, 'Marked as Urgent Work: ' + urgencyReason, currentUser().id, 'urgent');
      showToast('Task created');
      clearTaskDraft();
    } catch(e){ showToast('Could not save the task — check your connection and try again'); return; }
  }
  closeModal();
}

/* ---- Task Detail (progress, status, comments, completion) ---- */
function openTaskDetail(id){ state.modal = { type:'taskDetail', taskId:id, showCompletionPrompt:false, showRejectPrompt:false }; state.notifOpen = false; render(); }
function setProgress(id, val){
  const t = DB.tasks.find(x => x.id===id);
  if (!canUpdateProgress(t)) return;
  if (val === 100){ state.modal.showCompletionPrompt = true; render(); return; }
  const patch = { progress: val };
  if (t.status === 'Not Started' && val > 0) patch.status = 'In Progress';
  if ((t.status === 'Completed' || t.status === 'Pending Approval') && val < 100){ patch.status = val > 0 ? 'In Progress' : 'Not Started'; patch.completionDate = null; }
  DB.updateTask(id, patch);
  render();
}
function spawnNextRecurrence(t){
  if (!t || !t.recurrence) return;
  const nextStart = advanceDateByRecurrence(t.startDate, t.recurrence);
  const nextDue = advanceDateByRecurrence(t.dueDate, t.recurrence);
  DB.addTask({
    name: t.name, description: t.description||'', assignedTo: t.assignedTo, assignedBy: t.assignedBy,
    department: t.department, project: t.project, createdDate: todayISO(), startDate: nextStart, dueDate: nextDue,
    priority: t.priority, level: t.level, status: 'Not Started', estimatedHours: null, actualHours: null,
    progress: 0, completionDate: null, completionNotes: '', recurrence: t.recurrence
  }).then(function(){
    showToast('Task completed — next ' + (RECURRENCE_LABELS[t.recurrence]||'').toLowerCase() + ' occurrence created, due ' + fmtDate(nextDue));
  }).catch(function(){
    showToast('Task completed, but the next recurring occurrence could not be created');
  });
}
function confirmCompletion(id){
  const t = DB.tasks.find(x => x.id===id);
  const wasOverdue = t && isOverdue(t);
  const notes = document.getElementById('completion-notes').value.trim();
  if (wasOverdue && !notes){ flagFieldError('completion-notes', 'Required — explain why this task is late'); return; }
  const finalNotes = wasOverdue ? ('Late — ' + notes) : notes;
  if (isAdmin()){
    DB.updateTask(id, { progress:100, status:'Completed', completionDate:new Date().toISOString(), completionNotes:finalNotes });
    DB.addComment(id, finalNotes || 'Marked as complete.', currentUser().id, 'completion');
    state.modal.showCompletionPrompt = false;
    if (t) spawnNextRecurrence(t);
    showToast('Task marked complete');
  } else {
    DB.updateTask(id, { progress:100, status:'Pending Approval', completionDate:new Date().toISOString(), completionNotes:finalNotes });
    DB.addComment(id, finalNotes || 'Submitted for manager approval.', currentUser().id, 'completion');
    state.modal.showCompletionPrompt = false;
    showToast('Submitted for approval');
  }
}
function cancelCompletionPrompt(){ state.modal.showCompletionPrompt = false; render(); }
function approveTask(id){
  const t = DB.tasks.find(x => x.id===id);
  if (!isAdmin() || !t || t.status !== 'Pending Approval') return;
  DB.updateTask(id, { status:'Completed' });
  DB.addComment(id, 'Approved by ' + currentUser().name + '.', currentUser().id, 'approval');
  spawnNextRecurrence(t);
  showToast('Task approved');
}
function rejectTask(id){ state.modal.showRejectPrompt = true; render(); }
function cancelReject(){ state.modal.showRejectPrompt = false; render(); }
function confirmReject(id){
  const t = DB.tasks.find(x => x.id===id);
  if (!isAdmin() || !t || t.status !== 'Pending Approval') return;
  const reason = document.getElementById('reject-reason').value.trim();
  DB.updateTask(id, { status:'In Progress', progress:75, completionDate:null });
  DB.addComment(id, reason ? ('Sent back for rework: ' + reason) : 'Sent back for rework.', currentUser().id, 'approval');
  state.modal.showRejectPrompt = false;
  showToast('Sent back to the assignee');
}
function setTaskStatus(id, status){
  const t = DB.tasks.find(x => x.id===id);
  if (!canUpdateProgress(t)) return;
  if (status === 'Completed'){ state.modal.showCompletionPrompt = true; render(); return; }
  const patch = { status };
  if (status === 'Not Started') patch.progress = 0;
  if ((t.status === 'Completed' || t.status === 'Pending Approval') && status !== 'Completed') patch.completionDate = null;
  DB.updateTask(id, patch);
  render();
}
function addTaskComment(id){

function employeeReportPanel(sel, r){

        efficiencyBreakdownCard(sel.stats) +
        '<div class="sub">Total Task Points Completed: <b class="num" style="color:var(--ink)">'+sel.stats.taskPoints+'</b> (of a possible '+sel.stats.maxPoints+' from '+sel.stats.completed+' completed task'+(sel.stats.completed===1?'':'s')+') — weighting Level 1–4 tasks at 1–4 points each so complex work counts for more.</div>' +

function momComparePanel(empId, mom){
  const emp = DB.employees.find(e => e.id===empId);
  const r = state.report;
  return '<div class="flex gap-10" style="margin-bottom:12px;flex-wrap:wrap">' +
      '<span class="sub" style="align-self:center">Comparing</span>' + periodSelect('cp', r.cYear, r.cMonth, 'setComparePeriod') +
      '<span class="sub" style="align-self:center">→</span>' + periodSelect('rp2', r.year, r.month, 'setReportPeriod') +
    '</div>' +
    '<div class="grid" style="grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:10px">' +
      momTile('Efficiency', mom.prev.stats.efficiency, mom.curr.stats.efficiency, mom.delta.efficiency, mom.delta.efficiencyPct) +
      momTile('Completion Rate', mom.prev.stats.completionRate, mom.curr.stats.completionRate, mom.delta.completionRate) +
      momTile('On-Time Rate', mom.prev.stats.onTimeRate, mom.curr.stats.onTimeRate, mom.delta.onTimeRate) +
      momTile('Tasks Completed', mom.prev.stats.completed, mom.curr.stats.completed, mom.delta.completed, null, true) +
      momTile('Overdue Tasks', mom.prev.stats.overdue, mom.curr.stats.overdue, mom.delta.overdue, null, true, true) +
    '</div>' +
    '<div class="flex gap-8"><span class="pill" style="background:var(--surface-2);color:var(--ink-soft)">'+emp.name+'</span>' +
      '<span class="'+trendClass(mom.delta.efficiency)+'">Overall performance '+trendLabel(mom.delta.efficiency).toLowerCase()+' from '+monthLabel(mom.prev.year,mom.prev.month)+' to '+monthLabel(mom.curr.year,mom.curr.month)+(Math.abs(mom.delta.efficiencyPct)>=1.5?(' ('+(mom.delta.efficiencyPct>=0?'+':'')+mom.delta.efficiencyPct.toFixed(1)+'%)'):'')+'.</span>' +
    '</div>';
}
function momTile(label, prev, curr, delta, deltaPct, isCount, invertGood){
  const good = invertGood ? delta<=0 : delta>=0;
  const cls = Math.abs(delta) < (isCount?0.5:1.5) ? 'trend-flat' : (good?'trend-up':'trend-down');
  const fmt = v => isCount ? Math.round(v) : Math.round(v)+'%';
  return '<div class="card kpi"><div class="kpi-label">'+label+'</div>' +
    '<div class="kpi-value num" style="font-size:19px">'+fmt(prev)+' → '+fmt(curr)+'</div>' +
    '<div class="kpi-foot '+cls+'">'+(delta>0?'+':'')+(isCount?Math.round(delta):Math.round(delta)+'pt')+(deltaPct!=null?' ('+(deltaPct>=0?'+':'')+deltaPct.toFixed(1)+'%)':'')+'</div>' +
  '</div>';
}

function viewReportsMember(u){
  const r = state.report;

  return '<div class="page-head"><div><div class="page-title">My Performance Report</div><div class="page-sub">Your monthly efficiency, transparently calculated</div></div>' +
    '<div class="page-actions">' + periodSelect('rp', r.year, r.month, 'setReportPeriod') + '</div></div>' +
    employeeReportPanel({employee:u, stats}, r) +

      '<label class="flex gap-6" style="font-size:12px;font-weight:700;cursor:pointer"><input type="checkbox" '+(r.compareMode?'checked':'')+' onchange="toggleCompareMode()" /> Enable</label>' +
    '</div><div class="card-pad">' +
      (!r.compareMode ? '<div class="sub">Enable to compare this month against a previous month.</div>' : momComparePanel(u.id, mom)) +
    '</div></div>';
}

async function saveEmployeeForm(id){
  const name = document.getElementById('ef-name').value.trim();
  if (!name){ showToast('Name is required'); return; }
  const title = document.getElementById('ef-title').value.trim();
  const email = document.getElementById('ef-email').value.trim().toLowerCase();
  const department = document.getElementById('ef-dept').value;
  const role = document.getElementById('ef-role').value;
  const superAdmin = document.getElementById('ef-superadmin').checked;
  const joinDate = document.getElementById('ef-join').value;
  if (id){
    DB.updateEmployee(id, {name, title, email, department, role, superAdmin, joinDate});
    showToast('Employee updated');
  } else {
    try {
      await DB.addEmployee({name, title, email, department, role, superAdmin, joinDate, active:true});
      showToast('Employee added');
    } catch(e){ showToast('Could not add the employee — check your connection and try again'); return; }
  }
  closeModal();
}

/* =====================================================================
   19. INIT
   ===================================================================== */
document.addEventListener('click', function(e){
  if (state.notifOpen && !e.target.closest('.notif-panel') && !e.target.closest('.icon-btn')){
    state.notifOpen = false; render();
  }
});

function getSavedUser(){
  try {
    const saved = localStorage.getItem('tf_access_code');
    if (!saved) return null;
    return DB.employees.find(e => e.token === saved && e.active) || null;
  } catch(e){ return null; }
}

async function initApp(){
  try {
    await DB.fetchAll();
  } catch(e){
    console.error('DC Jain Task Management System: failed to load data', e);
    document.getElementById('app').innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F5F7F5">' +
        '<div class="card card-pad" style="max-width:420px;text-align:center">' +
          '<div style="font-weight:800;font-size:16px;margin-bottom:6px;color:var(--bad)">Could not connect</div>' +
          '<div class="sub">This app could not reach its database. Check your internet connection and reload the page. If this keeps happening, ask your workspace administrator to check the database configuration.</div>' +
        '</div>' +
      '</div>';
    return;
  }
  DB.setupRealtime(render);

  // A clicked magic-link redirect lands back here with the session already
  // established by the supabase-js client (it parses the URL automatically).
  // Check for that before falling back to the saved access-code session.
  let signedInViaEmail = false;
  try {
    const { data } = await sb.auth.getSession();
    const authEmail = data && data.session && data.session.user && data.session.user.email;
    if (authEmail){
      const emp = DB.employees.find(e => e.active && e.email && e.email.toLowerCase() === authEmail.toLowerCase());
      if (emp){
        state.currentUserId = emp.id;
        state.locked = !emp.superAdmin;
        try { localStorage.setItem('tf_access_code', emp.token); } catch(e){}
        signedInViaEmail = true;
      }
    }
  } catch(e){}

  if (!signedInViaEmail){
    const savedUser = getSavedUser();
    if (savedUser){
      state.currentUserId = savedUser.id;
      state.locked = !savedUser.superAdmin;
    } else {
      state.currentUserId = null;
      state.locked = true;
    }
  }
  if (state.currentUserId) requestNotificationPermission();
  render();

  // Safety-net refresh on top of the realtime subscription — pulls the
  // latest data every 10 minutes in case a realtime connection was missed
  // or silently dropped. Skipped while a modal is open so it can't wipe
  // out an in-progress form.
  setInterval(async function(){
    if (state.modal) return;
    try {
      await DB.fetchAll();
      render();
    } catch(e){ console.error('DC Jain Task Management System: periodic refresh failed', e); }
  }, 10 * 60 * 1000);
}
initApp();
</script>
