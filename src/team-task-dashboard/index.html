<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DC Jain Task Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================= TOKENS ============================= */
  :root{
    --bg:#F7F8FA; --bg-inset:#EEF0F3; --surface:rgba(255,255,255,.86); --surface-2:rgba(255,255,255,.55);
    --surface-solid:#FFFFFF; --surface-modal:rgba(255,255,255,.96);
    --border:rgba(16,24,40,.08); --border-strong:rgba(16,24,40,.15);
    --ink:#101828; --ink-soft:#667085; --ink-faint:#98A2B3;
    --accent:#FF6500; --accent-strong:#E55400; --accent-soft:rgba(255,101,0,.13); --accent-ink:#FFFFFF;
    --gold:#B7791F; --gold-soft:rgba(183,121,31,.14);
    --good:#12B76A; --good-soft:rgba(18,183,106,.13);
    --warn:#F79009; --warn-soft:rgba(247,144,9,.14);
    --bad:#F04438; --bad-soft:rgba(240,68,56,.12);
    --info:#3767AC; --info-soft:rgba(55,103,172,.12);
    --neutral-status:#667085; --neutral-soft:rgba(102,112,133,.13);
    --glow-1:rgba(255,101,0,.08); --glow-2:rgba(102,112,133,.06); --glow-3:rgba(255,101,0,.05);
    --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07);
    --glass-blur:blur(18px) saturate(160%);
    --radius:16px; --radius-sm:10px;
    --ease:cubic-bezier(.4,0,.2,1);
    --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  /* Theme is a manual per-device choice (the sun/moon toggle in the topbar
     and access gate), not tied to the OS dark-mode setting. */
  :root[data-theme="dark"]{
    --bg:#16181B; --bg-inset:#101214; --surface:rgba(32,36,41,.58); --surface-2:rgba(32,36,41,.38);
    --surface-solid:#1D2024; --surface-modal:rgba(29,32,36,.94);
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
    --ink:#ECEEF1; --ink-soft:#B6BBC2; --ink-faint:#838993;
    --accent:#FF8A3D; --accent-strong:#FFAA66; --accent-soft:rgba(255,138,61,.17); --accent-ink:#241505;
    --gold:#D8A857; --gold-soft:rgba(216,168,87,.16);
    --good:#4FBE7E; --good-soft:rgba(79,190,126,.16);
    --warn:#D9A159; --warn-soft:rgba(217,161,89,.16);
    --bad:#E17272; --bad-soft:rgba(225,114,114,.16);
    --info:#7CA6E0; --info-soft:rgba(124,166,224,.16);
    --neutral-status:#9AA1AA; --neutral-soft:rgba(154,161,170,.16);
    --glow-1:rgba(255,138,61,.14); --glow-2:rgba(255,255,255,.045); --glow-3:rgba(255,138,61,.07);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink); font-family:var(--font-ui);
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
    background-color:var(--bg);
    background-image:
      radial-gradient(1100px 700px at 6% -12%, var(--glow-1), transparent 55%),
      radial-gradient(900px 700px at 104% 8%, var(--glow-2), transparent 50%),
      radial-gradient(900px 650px at 30% 122%, var(--glow-3), transparent 55%);
    background-attachment:fixed;
  }
  #app{display:flex; min-height:100vh;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}
  .mono{font-family:var(--font-mono);}
  .ellipsis{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---------- layout shell ---------- */
  .sidebar{
    width:228px; flex:0 0 228px; background:var(--surface);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border-right:1px solid var(--border); box-shadow:var(--shadow);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
    transition:transform .25s var(--ease);
  }
  .brand{display:flex; align-items:center; gap:10px; padding:18px 18px 14px;}
  .brand-mark{width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg, var(--accent), var(--accent-strong)); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; letter-spacing:-.02em; flex:0 0 auto;
    box-shadow:0 4px 14px rgba(255,153,51,.35);}
  .brand-name{font-weight:800; font-size:15.5px; letter-spacing:-.01em;}
  .brand-sub{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.07em; margin-top:1px;}

  .nav{padding:6px 10px; display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm);
    color:var(--ink-soft); font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent;
    user-select:none; transition:background .15s var(--ease), color .15s var(--ease), transform .15s var(--ease);
  }
  .nav-item:hover{background:var(--surface-2); color:var(--ink); transform:translateX(2px);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent-strong); box-shadow:inset 3px 0 0 var(--accent);}
  .nav-icon{width:17px; text-align:center; flex:0 0 auto; font-size:14px;}
  .nav-section-label{font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-faint); padding:14px 12px 4px; font-weight:700;}

  .sidebar-foot{margin-top:auto; padding:12px; border-top:1px solid var(--border);}
  .role-switch{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px;}
  .role-switch label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:700; margin-bottom:4px;}
  .role-switch select{width:100%; border:1px solid var(--border-strong); background:var(--surface-solid); color:var(--ink); border-radius:6px; padding:6px 7px; font-size:12.5px; font-weight:600;}

  .sidebar-backdrop{position:fixed; inset:0; background:rgba(12,14,16,.42); backdrop-filter:blur(2px); z-index:250;}

  .menu-btn{display:none;}

  .main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px; padding:12px 24px;
  }
  .search-wrap{position:relative; flex:1 1 380px; max-width:440px;}
  .search-wrap input{
    width:100%; padding:8px 12px 8px 32px; border-radius:10px; border:1px solid var(--border-strong);
    background:var(--surface-solid); color:var(--ink); font-size:13px; transition:box-shadow .15s var(--ease), border-color .15s var(--ease);
  }
  .search-wrap input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .search-icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:13px;}
  .topbar-spacer{flex:1 1 auto;}
  .icon-btn{
    position:relative; width:34px; height:34px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-solid); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px; transition:background .15s var(--ease), color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--ink); transform:translateY(-1px); box-shadow:var(--shadow);}
  .badge-dot{position:absolute; top:-4px; right:-4px; background:var(--bad); color:#fff; font-size:10px; font-weight:700;
    min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
  .profile-chip{display:flex; align-items:center; gap:8px; padding:4px 10px 4px 4px; border-radius:22px; border:1px solid var(--border); background:var(--surface-solid); cursor:pointer; transition:box-shadow .15s var(--ease);}
  .profile-chip:hover{box-shadow:var(--shadow);}
  .profile-menu-item{padding:10px 14px; font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border);}
  .profile-menu-item:last-child{border-bottom:none;}
  .profile-menu-item:hover{background:var(--surface-2);}
  .avatar{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff; flex:0 0 auto;}
  .avatar.lg{width:44px; height:44px; font-size:16px;}
  .profile-name{font-size:12.5px; font-weight:700;}
  .profile-role{font-size:10.5px; color:var(--ink-faint);}

  .content{padding:22px 26px 60px; max-width:1360px; width:100%; margin:0 auto;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
  .page-title{font-size:21px; font-weight:800; letter-spacing:-.015em; text-wrap:balance;}
  .page-sub{color:var(--ink-faint); font-size:12.5px; margin-top:2px;}
  .page-actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-size:13px; font-weight:700;
    border:1px solid var(--border-strong); background:var(--surface-solid); color:var(--ink); cursor:pointer; white-space:nowrap;
    transition:background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .btn:hover{background:var(--surface-2); transform:translateY(-1px); box-shadow:var(--shadow);}
  .btn:active{transform:translateY(0); box-shadow:none;}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-strong)); border-color:var(--accent-strong); color:var(--accent-ink); box-shadow:0 4px 14px rgba(255,153,51,.3);}
  .btn-primary:hover{background:linear-gradient(135deg, var(--accent-strong), var(--accent)); border-color:var(--accent-strong); box-shadow:0 6px 20px rgba(255,153,51,.4); transform:translateY(-1px);}
  .btn-ghost{border-color:transparent; background:transparent; box-shadow:none;}
  .btn-ghost:hover{background:var(--surface-2); box-shadow:none;}
  .btn-danger{color:var(--bad); border-color:var(--bad-soft); background:var(--bad-soft);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:8px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed; transform:none;}

  /* ---------- cards / grid ---------- */
  .grid{display:grid; gap:14px;}
  .grid-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .grid-2{grid-template-columns:1.4fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-emp{grid-template-columns:repeat(3,1fr);}
  @media(max-width:1100px){.grid-kpi{grid-template-columns:repeat(3,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr 1fr;} .grid-emp{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:680px){.grid-kpi{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-emp{grid-template-columns:1fr;}}

  .card{background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease);}
  .card[onclick]:hover{transform:translateY(-3px); box-shadow:0 16px 36px rgba(32,36,42,.14);}
  .card-pad{padding:16px 18px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px 0;}
  .card-title{font-size:13px; font-weight:800; letter-spacing:-.01em;}
  .card-title-sm{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}

  .kpi{padding:16px 18px;}
  .kpi-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .kpi-ico{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .kpi-trend{display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:800; padding:2px 6px; border-radius:20px;}
  .kpi-trend.up{color:var(--good); background:var(--good-soft);}
  .kpi-trend.down{color:var(--bad); background:var(--bad-soft);}
  .kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700;}
  .kpi-value{font-size:26px; font-weight:800; margin-top:6px; letter-spacing:-.02em;}
  .kpi-foot{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
  .kpi-value.good{color:var(--good);} .kpi-value.bad{color:var(--bad);} .kpi-value.warn{color:var(--warn);}

  /* ---------- donut / project bars / workload chart ---------- */
  .donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .donut-svg{transform:rotate(-90deg); flex:0 0 auto;}
  .donut-center{position:relative;}
  .donut-center .val{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .donut-center .val b{font-size:20px; font-weight:800; line-height:1;}
  .donut-center .val span{font-size:10px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .donut-legend{display:flex; flex-direction:column; gap:7px; flex:1 1 auto; min-width:120px;}
  .donut-legend-row{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .donut-seg{cursor:pointer; transition:opacity .12s var(--ease);}
  .donut-seg:hover{opacity:.78;}
  .chart-point{cursor:pointer; transition:r .12s var(--ease);}
  .chart-point:hover{r:4.5;}
  .legend-dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .proj-bar-row{padding:7px 0; cursor:pointer;}
  .proj-bar-head{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:5px;}
  .workload-row{display:flex; align-items:center; gap:10px; padding:6px 0;}
  .workload-bars{flex:1; display:flex; gap:3px; height:9px;}
  .workload-bars span{border-radius:4px; background:var(--surface-2); border:1px solid var(--border);}

  /* ---------- mini calendar / quick actions / activity feed ---------- */
  .mini-cal-head-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .mini-cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .mini-cal-dow{font-size:9.5px; color:var(--ink-faint); font-weight:700; text-align:center; padding-bottom:4px;}
  .mini-cal-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:11px; border-radius:7px; cursor:pointer; position:relative; font-weight:600; transition:background .12s var(--ease);}
  .mini-cal-cell:hover{background:var(--surface-2);}
  .mini-cal-cell.empty{cursor:default;}
  .mini-cal-cell.empty:hover{background:none;}
  .mini-cal-cell.today{background:var(--accent); color:var(--accent-ink); font-weight:800;}
  .mini-cal-dot{position:absolute; bottom:3px; width:4px; height:4px; border-radius:50%;}
  .quick-actions-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .quick-action-btn{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-solid); cursor:pointer; font-size:11.5px; font-weight:700; color:var(--ink-soft); transition:background .12s var(--ease), color .12s var(--ease);}
  .quick-action-btn:hover{background:var(--accent-soft); color:var(--accent-strong);}
  .activity-row{display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); cursor:pointer;}

  /* ---------- Time Log ---------- */
  .timelog-emp-card{margin-bottom:14px;}
  .timelog-total{font-size:12.5px; font-weight:800;}
  .timelog-total.warn{color:var(--warn);}
  .timelog-total.bad{color:var(--bad);}
  .timelog-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border);}
  .timelog-row:last-child{border-bottom:none;}
  .timelog-time{font-size:11.5px; font-weight:700; color:var(--ink-soft); width:118px; flex:0 0 auto;}
  .activity-row:last-child{border-bottom:none;}

  /* ---------- pills / chips ---------- */
  .pill{display:inline-flex; align-items:center; gap:5px; padding:2.5px 8px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;}
  .dot{width:6px; height:6px; border-radius:50%; flex:0 0 auto;}
  .pill-critical{background:var(--bad-soft); color:var(--bad);}
  .pill-high{background:var(--warn-soft); color:var(--warn);}
  .pill-medium{background:var(--info-soft); color:var(--info);}
  .pill-low{background:var(--neutral-soft); color:var(--neutral-status);}
  .pill-status-notstarted{background:var(--neutral-soft); color:var(--neutral-status);}
  .pill-status-inprogress{background:var(--info-soft); color:var(--info);}
  .pill-status-onhold{background:var(--warn-soft); color:var(--warn);}
  .pill-status-pendingapproval{background:var(--gold-soft); color:var(--gold);}
  .pill-status-completed{background:var(--good-soft); color:var(--good);}
  .pill-status-cancelled{background:var(--surface-2); color:var(--ink-faint); text-decoration:line-through;}
  .pill-overdue{background:var(--bad); color:#fff;}
  .pill-urgent{background:var(--bad); color:#fff; animation:urgentPulse 2s ease-in-out infinite;}
  @keyframes urgentPulse{0%,100%{opacity:1;} 50%{opacity:.72;}}
  .pill-fixed{background:var(--neutral-soft); color:var(--neutral-status);}
  .level-bars{display:inline-flex; align-items:flex-end; gap:2px; height:12px; vertical-align:middle;}
  .level-bars i{width:3px; display:block; background:var(--border-strong); border-radius:1px;}
  .level-bars i:nth-child(1){height:4px;} .level-bars i:nth-child(2){height:7px;} .level-bars i:nth-child(3){height:10px;} .level-bars i:nth-child(4){height:13px;}
  .level-bars i.on{background:var(--accent);}
  .level-tag{font-size:11px; font-weight:700; color:var(--ink-soft); display:inline-flex; align-items:center; gap:5px;}

  /* ---------- table ---------- */
  .table-wrap{overflow-x:auto;}
  table{border-collapse:collapse; width:100%; font-size:12.8px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none;}
  th:hover{color:var(--ink);}
  th.sorted{color:var(--accent-strong);}
  td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr.row{transition:background .12s var(--ease);}
  tr.row:hover td{background:var(--surface-2);}
  .task-name-cell{font-weight:700; cursor:pointer; transition:color .12s var(--ease);}
  .task-name-cell:hover{color:var(--accent-strong);}
  .sub{color:var(--ink-faint); font-size:11.5px;}

  .progress-track{width:80px; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border);}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius:4px; transition:width .2s var(--ease);}
  .progress-track.lg{width:100%; height:10px;}

  /* ---------- filter bar ---------- */
  .filter-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .chip-filter{padding:6px 12px; border-radius:20px; border:1px solid var(--border-strong); background:var(--surface-solid); font-size:12px; font-weight:700; cursor:pointer; color:var(--ink-soft);
    transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease);}
  .chip-filter:hover{transform:translateY(-1px);}
  .chip-filter.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .view-tabs{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:16px; background:var(--surface-solid); border:1px solid var(--border); border-radius:12px; padding:4px;}
  .view-tab{padding:7px 14px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; transition:background .15s var(--ease), color .15s var(--ease);}
  .view-tab:hover{background:var(--surface-2);}
  .view-tab.active{background:var(--accent); color:var(--accent-ink);}
  .kanban-board{display:flex; gap:14px; overflow-x:auto; padding-bottom:8px;}
  .kanban-col{flex:0 0 260px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; min-height:120px;}
  .kanban-col.dragover{background:var(--accent-soft); border-color:var(--accent);}

<body>
<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#7C857F;font:14px -apple-system,sans-serif">Loading DC Jain Task Management System…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";

/* =====================================================================
   0. BACKEND CONFIG
   Real shared Postgres database via Supabase. The anon/public key below
   is safe to ship in client code by design — it identifies the project,
   it does not grant it. Access to data is governed by the Row Level
   Security policies on the database itself (see schema.sql), not by
   keeping this key secret.
   ===================================================================== */
const SUPABASE_URL = 'https://iubvxxihxqesabwflxsq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sZr74GUFEBqYaAJi8ar_fg_FtiYhsHz';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =====================================================================
   1. DATA LAYER
   In-memory store for this demo. Swap DB's internals for calls to
   Supabase / Firebase / Airtable / Postgres without touching any UI code
   below — every view reads only through DB.* and the business-logic
   functions in section 2.
   ===================================================================== */
const DEFAULT_MASCOT = '📁';
const DB = (function(){
  // Local cache mirroring the real Supabase tables. Every view in this
  // app reads these plain arrays synchronously, same as before — this
  // module's job is to keep them in sync with the shared database via
  // (a) an initial fetch, (b) optimistic local writes on every mutation,
  // and (c) a realtime subscription that merges in changes made by
  // anyone else, on any other device, without a manual refresh.
  const employees = [];
  const departments = [];
  const projects = [];
  const tasks = [];
  const notifications = [];
  const notificationReads = [];
  // Whether the `recurrence` column exists yet on `tasks` — false until
  // add_recurrence_column.sql has been run. Detected in fetchAll() so
  // every insert/update degrades gracefully instead of failing outright
  // (an unknown column makes PostgREST reject the entire write).
  let recurrenceSupported = true;
  // Whether the `linked_task_id` column exists yet on `tasks` — used for
  // resource requests (a task created from inside another task, asking a
  // teammate for something). Same graceful-degradation approach as above.
  let linkedTaskSupported = true;
  // Whether the urgent-work / schedule-type columns exist yet on `tasks`.
  // Same graceful-degradation approach as above.
  let urgentFieldsSupported = true;
  // Whether the work start/end time columns exist yet on `tasks` (for
  // the Time Log work-hour monitoring page). Same approach as above.
  let workHoursSupported = true;
  const deptRows = [];   // internal {dbId, name} — departments/projects are
  const projRows = [];   // plain TEXT columns on tasks/employees, not FKs

  function rawId(prefixedId){ return prefixedId == null ? null : Number(String(prefixedId).slice(1)); }

  // Deterministic, human-typeable access code for newly-added employees
  // (existing employees already have a token seeded into the database).
  function hash32(str){
    let h = 2166136261 >>> 0;
    for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  function deterministicToken(seedStr){
    const s = 'taskframe-code-v1::' + seedStr;
    const h1 = hash32(s);
    const h2 = hash32(s + '::' + h1.toString(36));
    const raw = normalizeCode(h1.toString(36) + h2.toString(36)).padEnd(8,'0').slice(0,8);
    return raw.slice(0,4) + '-' + raw.slice(4,8);
  }
  function uniqueToken(name){
    let n = 0, candidate = deterministicToken(name);
    while (employees.some(e => e.token === candidate)){ n++; candidate = deterministicToken(name + '::' + n); }
    return candidate;
  }

  function mapEmployeeRow(row){
    return { id:'E'+row.id, dbId:row.id, name:row.name, role:row.role, department:row.department,
      title:row.title||'', joinDate:row.join_date, active:row.active, token:row.token, email:row.email||'',
      superAdmin: !!row.super_admin };
  }
  function mapTaskRow(row){
    return { id:'T'+String(row.id).padStart(3,'0'), dbId:row.id, name:row.name, description:row.description||'',
      assignedTo: row.assigned_to!=null ? 'E'+row.assigned_to : null, assignedBy: row.assigned_by!=null ? 'E'+row.assigned_by : null,
      department:row.department, project:row.project, createdDate:row.created_date, startDate:row.start_date, dueDate:row.due_date,
      priority:row.priority, level:row.level, status:row.status, estimatedHours:row.estimated_hours, actualHours:row.actual_hours,
      completionDate:row.completion_date, progress:row.progress, completionNotes:row.completion_notes||'', recurrence:row.recurrence||null,
      linkedTaskId: row.linked_task_id!=null ? 'T'+String(row.linked_task_id).padStart(3,'0') : null,
      isUrgent: !!row.is_urgent, urgencyReason: row.urgency_reason||'', scheduleType: row.schedule_type||'flexible',
      dailySequence: row.daily_sequence!=null ? row.daily_sequence : null,
      startTime: row.start_time||null, endTime: row.end_time||null, comments:[] };
  }
  function mapCommentRow(row){
    return { id:'C'+row.id, dbId:row.id, taskDbId:row.task_id, text:row.text, authorId: row.author_id!=null ? 'E'+row.author_id : null,
      type:row.type, at:row.at };
  }
  function mapNotificationRow(row){
    return { id:'N'+row.id, dbId:row.id, senderId: row.sender_id!=null ? 'E'+row.sender_id : null,
      recipientId: row.recipient_id!=null ? 'E'+row.recipient_id : null, type:row.type, title:row.title,
      body:row.body||'', createdAt:row.created_at };
  }
  function mapNotificationReadRow(row){
    return { notificationDbId:row.notification_id, employeeId:'E'+row.employee_id, readAt:row.read_at };
  }

  async function fetchAll(){
    const [empRes, deptRes, projRes, taskRes, commentRes] = await Promise.all([
      sb.from('employees').select('*').order('id'),
      sb.from('departments').select('*').order('id'),
      sb.from('projects').select('*').order('id'),
      sb.from('tasks').select('*').order('id'),
      sb.from('task_comments').select('*').order('id')
    ]);
    for (const r of [empRes, deptRes, projRes, taskRes, commentRes]) if (r.error) throw r.error;

    employees.length = 0; employees.push(...empRes.data.map(mapEmployeeRow));
    deptRows.length = 0; deptRows.push(...deptRes.data.map(r => ({dbId:r.id, name:r.name})));
    departments.length = 0; departments.push(...deptRows.map(r => r.name));
    projRows.length = 0; projRows.push(...projRes.data.map(r => ({dbId:r.id, name:r.name, mascot:r.mascot||DEFAULT_MASCOT})));
    projects.length = 0; projects.push(...projRows.map(r => r.name));
    tasks.length = 0; tasks.push(...taskRes.data.map(mapTaskRow));
    commentRes.data.map(mapCommentRow).forEach(c => {
      const t = tasks.find(x => x.dbId === c.taskDbId);
      if (t) t.comments.push(c);
    });

    // Notifications are a newer, optional feature — degrade gracefully
    // if this Supabase project hasn't had the notifications migration
    // run yet, rather than blocking the whole app from loading.
    try {
      const [notifRes, readRes] = await Promise.all([
        sb.from('notifications').select('*').order('id'),
        sb.from('notification_reads').select('*')
      ]);
      if (notifRes.error) throw notifRes.error;
      if (readRes.error) throw readRes.error;
      notifications.length = 0; notifications.push(...notifRes.data.map(mapNotificationRow));
      notificationReads.length = 0; notificationReads.push(...readRes.data.map(mapNotificationReadRow));
    } catch(e){
      console.warn('Notifications feature unavailable — run notifications_migration.sql in Supabase to enable it.', e && e.message);
    }

    // Recurring tasks are also a newer, optional column — probe for it so
    // addTask/updateTask know whether it's safe to include, rather than
    // having every task save silently fail against an older schema.
    try {
      const { error } = await sb.from('tasks').select('recurrence').limit(1);
      recurrenceSupported = !error;
      if (error) console.warn('Recurring tasks unavailable — run add_recurrence_column.sql in Supabase to enable it.', error.message);
    } catch(e){ recurrenceSupported = false; }

    // Same probe for resource-request linking.
    try {
      const { error } = await sb.from('tasks').select('linked_task_id').limit(1);
      linkedTaskSupported = !error;
      if (error) console.warn('Resource requests unavailable — run add_linked_task_column.sql in Supabase to enable it.', error.message);
    } catch(e){ linkedTaskSupported = false; }

    // Same probe for urgent-work / schedule-type fields.
    try {
      const { error } = await sb.from('tasks').select('is_urgent,urgency_reason,schedule_type,daily_sequence').limit(1);
      urgentFieldsSupported = !error;
      if (error) console.warn('Urgent Work unavailable — run add_urgent_work_columns.sql in Supabase to enable it.', error.message);
    } catch(e){ urgentFieldsSupported = false; }

    // Same probe for work start/end time (Time Log).
    try {
      const { error } = await sb.from('tasks').select('start_time,end_time').limit(1);
      workHoursSupported = !error;
      if (error) console.warn('Work hours unavailable — run add_work_hours_columns.sql in Supabase to enable it.', error.message);
    } catch(e){ workHoursSupported = false; }
  }

  function setupRealtime(onChange){
    sb.channel('taskframe-db-changes')
      .on('postgres_changes', { event:'*', schema:'public', table:'employees' }, payload => {
        if (payload.eventType === 'DELETE'){ const i = employees.findIndex(e=>e.dbId===payload.old.id); if (i>-1) employees.splice(i,1); }
        else {
          const mapped = mapEmployeeRow(payload.new);
          const i = employees.findIndex(e => e.dbId === mapped.dbId);
          if (i>-1) Object.assign(employees[i], mapped); else employees.push(mapped);
        }
        onChange();
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'tasks' }, payload => {
        if (payload.eventType === 'DELETE'){ const i = tasks.findIndex(t=>t.dbId===payload.old.id); if (i>-1) tasks.splice(i,1); }
        else {
          const mapped = mapTaskRow(payload.new);
          const existing = tasks.find(t => t.dbId === mapped.dbId);
          const u = typeof currentUser === 'function' ? currentUser() : null;
          const justAssignedToMe = u && mapped.assignedTo === u.id && (!existing || existing.assignedTo !== mapped.assignedTo);
          const justMadeUrgentForMe = u && mapped.assignedTo === u.id && mapped.isUrgent && (!existing || !existing.isUrgent);
          if (existing){ mapped.comments = existing.comments; Object.assign(existing, mapped); } else { tasks.push(mapped); }
          if (justMadeUrgentForMe) notifyEvent('🔴 Urgent task: ' + mapped.name, mapped.urgencyReason || 'Needs your attention right away.');
          else if (justAssignedToMe) notifyEvent('New task assigned', mapped.name);
        }
        onChange();
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'task_comments' }, payload => {
        if (payload.eventType === 'DELETE'){
          const t = tasks.find(x => x.comments.some(c => c.dbId === payload.old.id));
          if (t){ const i = t.comments.findIndex(c=>c.dbId===payload.old.id); if (i>-1) t.comments.splice(i,1); }
        } else {
          const mapped = mapCommentRow(payload.new);
          const t = tasks.find(x => x.dbId === mapped.taskDbId);
          if (t){ const i = t.comments.findIndex(c=>c.dbId===mapped.dbId); if (i>-1) t.comments[i]=mapped; else t.comments.push(mapped); }
        }
        onChange();
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'departments' }, payload => {
        if (payload.eventType === 'DELETE'){ const i = deptRows.findIndex(r=>r.dbId===payload.old.id); if (i>-1){ deptRows.splice(i,1); departments.splice(i,1); } }
        else {
          const i = deptRows.findIndex(r => r.dbId === payload.new.id);
          if (i>-1){ deptRows[i].name = payload.new.name; departments[i] = payload.new.name; }
          else { deptRows.push({dbId:payload.new.id, name:payload.new.name}); departments.push(payload.new.name); }
        }
        onChange();
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'projects' }, payload => {
        if (payload.eventType === 'DELETE'){ const i = projRows.findIndex(r=>r.dbId===payload.old.id); if (i>-1){ projRows.splice(i,1); projects.splice(i,1); } }
        else {
          const i = projRows.findIndex(r => r.dbId === payload.new.id);
          if (i>-1){ projRows[i].name = payload.new.name; projRows[i].mascot = payload.new.mascot||DEFAULT_MASCOT; projects[i] = payload.new.name; }
          else { projRows.push({dbId:payload.new.id, name:payload.new.name, mascot:payload.new.mascot||DEFAULT_MASCOT}); projects.push(payload.new.name); }
        }
        onChange();
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'notifications' }, payload => {
        if (payload.eventType === 'DELETE'){ const i = notifications.findIndex(n=>n.dbId===payload.old.id); if (i>-1) notifications.splice(i,1); }
        else {
          const mapped = mapNotificationRow(payload.new);
          const i = notifications.findIndex(n => n.dbId === mapped.dbId);
          const isNew = i === -1;
          if (i>-1) Object.assign(notifications[i], mapped); else notifications.push(mapped);
          if (isNew && payload.eventType === 'INSERT'){
            const u = typeof currentUser === 'function' ? currentUser() : null;
            if (u && u.id !== mapped.senderId && (mapped.recipientId === null || mapped.recipientId === u.id)){
              notifyEvent(mapped.title, mapped.body);
            }
          }
        }
        onChange();
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'notification_reads' }, payload => {
        if (payload.eventType === 'DELETE') return;
        const mapped = mapNotificationReadRow(payload.new);
        if (!notificationReads.some(r => r.notificationDbId===mapped.notificationDbId && r.employeeId===mapped.employeeId)){

   ===================================================================== */
function pad2(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseISO(s){ if(!s) return null; const p=s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function todayDate(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function todayISO(){ return toISO(todayDate()); }
function addDaysISO(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function addMonthsISO(iso, n){ const d = parseISO(iso); const day = d.getDate(); d.setMonth(d.getMonth()+n); if (d.getDate() < day) d.setDate(0); return toISO(d); }
function addYearsISO(iso, n){ const d = parseISO(iso); d.setFullYear(d.getFullYear()+n); return toISO(d); }
function advanceDateByRecurrence(iso, recurrence){
  switch(recurrence){
    case 'daily': return addDaysISO(iso, 1);
    case 'weekly': return addDaysISO(iso, 7);
    case 'monthly': return addMonthsISO(iso, 1);
    case 'yearly': return addYearsISO(iso, 1);
    default: return iso;
  }
}
function daysBetween(isoA, isoB){ return Math.round((parseISO(isoB) - parseISO(isoA)) / 86400000); }
function startOfWeekISO(iso){ const d = parseISO(iso); const day = d.getDay(); const diff = (day===0?6:day-1); d.setDate(d.getDate()-diff); return toISO(d); }
function lastWeekRange(){ const thisMon = startOfWeekISO(todayISO()); return { start: addDaysISO(thisMon,-7), end: addDaysISO(thisMon,-1) }; }
function lastMonthRange(){ const d = parseISO(todayISO()); const firstThisMonth = new Date(d.getFullYear(), d.getMonth(), 1); const lastMonthEnd = new Date(d.getFullYear(), d.getMonth(), 0); const lastMonthStart = new Date(lastMonthEnd.getFullYear(), lastMonthEnd.getMonth(), 1); return { start: toISO(lastMonthStart), end: toISO(lastMonthEnd) }; }
function dashboardRangeBounds(){
  const r = state.dashboardRange;
  switch(r.preset){
    case 'yesterday': { const y = addDaysISO(todayISO(),-1); return { start:y, end:y }; }
    case 'lastweek': return lastWeekRange();
    case 'lastmonth': return lastMonthRange();
    case 'custom': return { start: r.customStart||todayISO(), end: r.customEnd||todayISO() };
    default: { const t = todayISO(); return { start:t, end:t }; }
  }
}
function dashboardRangeLabel(){
  const r = state.dashboardRange;
  const map = { today:'Today', yesterday:'Yesterday', lastweek:'Last Week', lastmonth:'Last Month', custom:'Custom Range' };
  return map[r.preset] || 'Today';
}
function fmtDate(iso){ if(!iso) return '—'; return parseISO(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return '—'; return parseISO(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtDateTime(iso){ const d = new Date(iso); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function monthLabel(y,m){ return new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
function sameMonth(iso,y,m){ if(!iso) return false; const d = parseISO(iso); return d.getFullYear()===y && d.getMonth()===m; }
function weekdayShort(iso){ return parseISO(iso).toLocaleDateString('en-US',{weekday:'short'}); }
function isSameDate(isoA, isoB){ return isoA === isoB; }
function prevMonth(y,m){ return m===0 ? {y:y-1,m:11} : {y:y,m:m-1}; }
function nextMonth(y,m){ return m===11 ? {y:y+1,m:0} : {y:y,m:m+1}; }
function startOfWeek(date){ const d = new Date(date); const day = d.getDay(); d.setDate(d.getDate()-day); return d; }

const LEVELS = {

const PRIORITIES = ['Critical','High','Medium','Low'];

function isOverdue(t){ return t.status !== 'Completed' && t.status !== 'Cancelled' && t.status !== 'Pending Approval' && t.dueDate < todayISO(); }
function daysRemaining(t){ return daysBetween(todayISO(), t.dueDate); }
function daysRemainingLabel(t){
  if (t.status === 'Completed') return 'Completed';
  if (t.status === 'Pending Approval') return 'Awaiting approval';
  if (t.status === 'Cancelled') return '—';
  const d = daysRemaining(t);
  if (d < 0) return Math.abs(d) + 'd overdue';
  if (d === 0) return 'Due today';
  if (d === 1) return 'Due tomorrow';
  return d + 'd left';
}

  const palette = ['#1F5E58','#8C6425','#2E5FA3','#AC3434','#6B4FA0','#3E7A3E','#A0527A','#4B6A8C'];

}

function tasksForEmployeeInMonth(empId, y, m){
  return DB.tasks.filter(t => t.assignedTo === empId && t.dueDate && sameMonth(t.dueDate, y, m));
}

function computeStats(taskList){
  const completed = taskList.filter(t => t.status === 'Completed');
  const cancelled = taskList.filter(t => t.status === 'Cancelled');
  const pendingApproval = taskList.filter(t => t.status === 'Pending Approval');
  const overdue = taskList.filter(isOverdue);
  const inProgress = taskList.filter(t => t.status === 'In Progress' && !isOverdue(t));
  const onHold = taskList.filter(t => t.status === 'On Hold' && !isOverdue(t));
  const notStarted = taskList.filter(t => t.status === 'Not Started' && !isOverdue(t));
  const pending = taskList.filter(t => (t.status === 'Not Started' || t.status === 'On Hold') && !isOverdue(t));
  const activeAssigned = taskList.length - cancelled.length;

  const completionRate = activeAssigned > 0 ? (completed.length / activeAssigned * 100) : 0;
  const onTime = completed.filter(t => t.completionDate && t.completionDate.slice(0,10) <= t.dueDate);
  const onTimeRate = completed.length > 0 ? (onTime.length / completed.length * 100) : 0;
  const taskPoints = completed.reduce((s,t) => s + t.level, 0);
  const maxPoints = completed.length * 4;
  const difficultyScore = completed.length > 0 ? (taskPoints / maxPoints * 100) : 0;
  const deadlineDiscipline = activeAssigned > 0 ? Math.max(0, 100 - (overdue.length / activeAssigned * 100)) : 0;

  const weekly = [0,0,0,0,0];
  completed.forEach(t => {
    if (t.completionDate){ const dt = new Date(t.completionDate); const wk = Math.min(4, Math.floor((dt.getDate()-1)/7)); weekly[wk]++; }
  });
  let consistency;
  if (completed.length === 0) consistency = 0;
  else if (completed.length === 1) consistency = 55;
  else {
    const mean = completed.length / 5;
    const variance = weekly.reduce((s,w) => s + Math.pow(w-mean,2), 0) / 5;
    const sd = Math.sqrt(variance);
    const cov = mean > 0 ? sd/mean : 0;
    consistency = Math.max(0, Math.min(100, 100 - cov*60));
  }
  const efficiency = completionRate*0.30 + onTimeRate*0.30 + difficultyScore*0.20 + deadlineDiscipline*0.10 + consistency*0.10;

  return {
    assigned: taskList.length, activeAssigned, completed: completed.length, cancelled: cancelled.length,
    overdue: overdue.length, inProgress: inProgress.length, onHold: onHold.length, notStarted: notStarted.length,
    pending: pending.length, pendingApproval: pendingApproval.length, completionRate, onTimeRate, taskPoints, maxPoints, difficultyScore,
    deadlineDiscipline, consistency, efficiency, weekly
  };
}

function companyStats(taskList){
  const all = taskList.filter(t => t.status !== 'Cancelled');
  const completed = all.filter(t => t.status === 'Completed');
  const pendingApproval = all.filter(t => t.status === 'Pending Approval');
  const overdue = all.filter(isOverdue);
  const inProgress = all.filter(t => t.status === 'In Progress' && !isOverdue(t));
  const pending = all.filter(t => (t.status === 'Not Started' || t.status === 'On Hold') && !isOverdue(t));
  const urgent = all.filter(t => t.isUrgent && t.status !== 'Completed');
  const onTime = completed.filter(t => t.completionDate && t.completionDate.slice(0,10) <= t.dueDate);
  const durations = completed.filter(t => t.startDate && t.completionDate).map(t => daysBetween(t.startDate, t.completionDate.slice(0,10)));
  const avgCompletionDays = durations.length ? (durations.reduce((a,b)=>a+b,0)/durations.length) : 0;
  const today = todayDate();
  const members = DB.employees.filter(e => e.role === 'member' && e.active);
  const effs = members.map(e => computeStats(tasksForEmployeeInMonth(e.id, today.getFullYear(), today.getMonth())).efficiency);
  const teamEfficiency = effs.length ? effs.reduce((a,b)=>a+b,0)/effs.length : 0;
  return {
    total: all.length, completed: completed.length, inProgress: inProgress.length, pending: pending.length,
    pendingApproval: pendingApproval.length, overdue: overdue.length, urgent: urgent.length,
    completionRate: all.length ? completed.length/all.length*100 : 0,
    onTimeRate: completed.length ? onTime.length/completed.length*100 : 0,
    avgCompletionDays, teamEfficiency
  };
}

/* ---------- weekly trend helper (real created/completed counts, no fabricated deltas) ---------- */
function weekWindow(weeksAgo){
  const end = addDaysISO(todayISO(), -7*weeksAgo);
  const start = addDaysISO(end, -6);
  return { start, end };
}
function trendPct(curr, prev){
  if (prev === 0) return curr === 0 ? null : 100;
  return Math.round((curr - prev) / prev * 100);
}
function weeklyTrends(taskList){
  const base = taskList.filter(t => t.status !== 'Cancelled');
  const thisWk = weekWindow(0), lastWk = weekWindow(1);
  const createdThis = base.filter(t => t.createdDate >= thisWk.start && t.createdDate <= thisWk.end).length;
  const createdLast = base.filter(t => t.createdDate >= lastWk.start && t.createdDate <= lastWk.end).length;
  const completedThis = base.filter(t => t.completionDate && t.completionDate.slice(0,10) >= thisWk.start && t.completionDate.slice(0,10) <= thisWk.end).length;
  const completedLast = base.filter(t => t.completionDate && t.completionDate.slice(0,10) >= lastWk.start && t.completionDate.slice(0,10) <= lastWk.end).length;
  return {
    createdThis, createdTrend: trendPct(createdThis, createdLast),
    completedThis, completedTrend: trendPct(completedThis, completedLast)
  };
}

/* ---------- Task Overview line chart (real per-day Created/Completed/Overdue counts) ---------- */
function taskOverviewChart(taskList, days){
  days = days || 7;
  const today = todayDate();
  const labels = [], created = [], completed = [], overdueSeries = [];
  for (let i=days-1;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const iso = toISO(d);
    labels.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    created.push(taskList.filter(t=>t.createdDate===iso).length);
    completed.push(taskList.filter(t=>t.completionDate && t.completionDate.slice(0,10)===iso).length);
    overdueSeries.push(taskList.filter(t=>t.status!=='Cancelled' && t.dueDate<iso && (!t.completionDate || t.completionDate.slice(0,10)>iso)).length);
  }
  const max = Math.max(2, ...created, ...completed, ...overdueSeries);
  const w = 560, h = 170, padL = 22, padB = 18, padT = 8, padR = 8;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  function seriesPath(series, color, seriesLabel){
    const pts = series.map((v,i) => [padL + (days===1?0:(i/(days-1))*plotW), padT + plotH - (v/max)*plotH]);
    const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const area = line + ' L'+pts[pts.length-1][0].toFixed(1)+','+(padT+plotH)+' L'+pts[0][0].toFixed(1)+','+(padT+plotH)+' Z';
    return '<path d="'+area+'" fill="'+color+'" opacity="0.07"></path><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2"/>' +
      pts.map((p,i)=>'<circle class="chart-point" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="'+color+'"><title>'+seriesLabel+' — '+labels[i]+': '+series[i]+'</title></circle>').join('');
  }
  const gridLines = [0,0.33,0.66,1].map(f => '<line x1="'+padL+'" y1="'+(padT+plotH*f).toFixed(1)+'" x2="'+(w-padR)+'" y2="'+(padT+plotH*f).toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>').join('');
  return '<div class="flex gap-14" style="font-size:11px;color:var(--ink-faint);font-weight:700;margin-bottom:6px;flex-wrap:wrap">' +
      '<span class="flex gap-6"><span class="legend-dot" style="background:var(--good)"></span>Completed</span>' +
      '<span class="flex gap-6"><span class="legend-dot" style="background:var(--bad)"></span>Overdue</span>' +
      '<span class="flex gap-6"><span class="legend-dot" style="background:var(--ink-faint)"></span>Created</span>' +
    '</div>' +
    '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">' + gridLines +
      seriesPath(created, 'var(--ink-faint)', 'Created') + seriesPath(overdueSeries, 'var(--bad)', 'Overdue') + seriesPath(completed, 'var(--good)', 'Completed') +
    '</svg>' +
    '<div class="flex" style="justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:2px">' + labels.map(l=>'<span>'+l+'</span>').join('') + '</div>';
}

function momCompare(empId, y1, m1, y2, m2){
  const s1 = computeStats(tasksForEmployeeInMonth(empId, y1, m1));
  const s2 = computeStats(tasksForEmployeeInMonth(empId, y2, m2));
  function pct(a,b){ if (Math.abs(a) < 0.001) return b===0 ? 0 : 100; return ((b-a)/a*100); }
  return {
    prev:{year:y1, month:m1, stats:s1}, curr:{year:y2, month:m2, stats:s2},
    delta:{
      efficiency: s2.efficiency - s1.efficiency, efficiencyPct: pct(s1.efficiency, s2.efficiency),
      completionRate: s2.completionRate - s1.completionRate, onTimeRate: s2.onTimeRate - s1.onTimeRate,
      completed: s2.completed - s1.completed, overdue: s2.overdue - s1.overdue
    }
  };
}
function trendLabel(delta){ if (Math.abs(delta) < 1.5) return 'Stable'; return delta > 0 ? 'Improved' : 'Declined'; }
function trendClass(delta){ if (Math.abs(delta) < 1.5) return 'trend-flat'; return delta > 0 ? 'trend-up' : 'trend-down'; }
function personalPerformanceAlert(u){
  const now = todayDate();
  const prev = prevMonth(now.getFullYear(), now.getMonth());
  const curTasks = tasksForEmployeeInMonth(u.id, now.getFullYear(), now.getMonth());
  const prevTasks = tasksForEmployeeInMonth(u.id, prev.y, prev.m);
  if (!curTasks.length && !prevTasks.length) return null;
  return momCompare(u.id, prev.y, prev.m, now.getFullYear(), now.getMonth());
}

function aiSummary(emp, stats, mom){
  const name = emp.name.split(' ')[0];
  const parts = [];
  parts.push(emp.name + ' completed ' + Math.round(stats.completionRate) + '% of assigned tasks this month and maintained a ' + Math.round(stats.onTimeRate) + '% on-time completion rate.');
  if (mom){
    const lbl = trendLabel(mom.delta.efficiency);
    if (lbl === 'Stable') parts.push('Overall efficiency remained stable compared with the previous month (' + Math.round(mom.prev.stats.efficiency) + ' → ' + Math.round(mom.curr.stats.efficiency) + ').');
    else parts.push('Efficiency ' + lbl.toLowerCase() + ' from ' + Math.round(mom.prev.stats.efficiency) + ' to ' + Math.round(mom.curr.stats.efficiency) + ' (' + (mom.delta.efficiencyPct>=0?'+':'') + mom.delta.efficiencyPct.toFixed(1) + '%) compared with the previous month.');
  }
  if (stats.completed > 0){
    const avgLevel = Math.round((stats.taskPoints/stats.completed) * 10) / 10;
    parts.push('The employee completed ' + stats.completed + ' task' + (stats.completed===1?'':'s') + ' this month with an average task level of ' + avgLevel.toFixed(1) + ' out of 4.');
  } else {
    parts.push('No tasks were completed by ' + name + ' this month.');
  }

  const strengths = [], improve = [];
  if (stats.onTimeRate >= 85) strengths.push('Strong deadline management');
  if (stats.completionRate >= 85) strengths.push('High completion rate');
  if (stats.difficultyScore >= 65) strengths.push('Consistently takes on higher-complexity work');
  if (stats.consistency >= 75) strengths.push('Steady output spread across the month');
  if (strengths.length === 0) strengths.push('Maintains baseline task throughput');

  if (stats.overdue > 0) improve.push('Reduce overdue tasks (' + stats.overdue + ' this month)');
  if (stats.onTimeRate < 70) improve.push('Improve on-time delivery rate');
  if (stats.consistency < 50) improve.push('Spread task completion more evenly across the month');
  if (stats.completionRate < 60) improve.push('Increase overall task completion rate');
  if (improve.length === 0) improve.push('No significant gaps identified this month');

  let recommendation;
  if (stats.overdue > 0) recommendation = 'Prioritize the ' + stats.overdue + ' overdue task' + (stats.overdue===1?'':'s') + ' and review current workload with the manager.';
  else if (stats.consistency < 50) recommendation = 'Encourage earlier starts on assigned tasks to avoid end-of-month clustering.';
  else if (stats.difficultyScore < 40 && stats.completionRate >= 80) recommendation = 'Consider assigning more Level 3–4 tasks to build strategic project experience.';
  else recommendation = 'Maintain current workflow — performance is on track.';

  return { summary: parts.join(' '), strengths, improve, recommendation };
}

/* ---------- alert sound + browser notification popup ---------- */
/* Most browsers won't let a fresh AudioContext make sound until the page
   has seen a real user gesture — grab the very first click/keypress to
   unlock it so a later realtime event (which fires with no gesture of its
   own) can still play the chime. */
let audioCtx = null;
function ensureAudioCtx(){
  if (!audioCtx && (window.AudioContext || window.webkitAudioContext)){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
}
['pointerdown','keydown'].forEach(function(evt){ document.addEventListener(evt, ensureAudioCtx, { once:true, passive:true }); });

function playNotificationSound(){
  ensureAudioCtx();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(1108.73, now + 0.12);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.25, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.42);
  } catch(e){}
}

function requestNotificationPermission(){
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') Notification.requestPermission().catch(function(){});
}
function showBrowserNotification(title, body){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title, { body: body || '', icon: 'assets/logo.png' });
    n.onclick = function(){ window.focus(); n.close(); };
  } catch(e){}
}
function notifyEvent(title, body){

function csvDownload(filename, headers, rows){
  const esc = v => { const s = (v==null?'':String(v)); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [headers.map(esc).join(',')].concat(rows.map(r => r.map(esc).join(',')));
  const csv = lines.join('\r\n');

  // The artifact viewer blocks plain <a download>/blob links outright — a
  // generated file can only reach the viewer through window.claude.downloads.
  // Fall back to the raw blob link for contexts without that capability
  // (e.g. opening this file directly rather than through the artifact viewer).
  if (window.claude && window.claude.downloads && window.claude.downloads.save){
    window.claude.downloads.save({ filename, data: csv }).then(() => {
      showToast('Exported ' + filename);
    }).catch(err => {
      const code = err && err.code;
      if (code === 'extension_not_enabled'){
        const txtName = filename.replace(/\.csv$/i, '.txt');
        window.claude.downloads.save({ filename: txtName, data: csv })
          .then(() => showToast('Exported ' + txtName + ' — open it in Sheets/Excel as CSV'))
          .catch(() => showToast('Export isn\'t available in this view'));
      } else if (code !== 'declined'){
        showToast('Export isn\'t available in this view');
      }
    });
    return;
  }
  // No downloads capability: if this document is embedded (window !== top,
  // as it is inside the artifact viewer), a blob/<a download> link is
  // silently blocked by the host — clicking it would look like it worked
  // but save nothing, so say so honestly instead of a false "Exported" toast.
  // Only a genuine top-level page (opened as a standalone file) can use it.
  if (window !== window.top){
    showToast('CSV export isn\'t available while shared this way — use Print instead');
    return;
  }
  csvDownloadRaw(filename, csv);
}

/* ---------- alerts (smart alerts, used by topbar + dashboard) ---------- */
function computeAlerts(scopeTasks){
  const tISO = todayISO(), tmwISO = addDaysISO(tISO,1), weekEndISO = addDaysISO(tISO,7);
  const soonStart = addDaysISO(tISO,2), soonEnd = addDaysISO(tISO,3);
  const dueToday = scopeTasks.filter(t => t.status!=='Completed' && t.status!=='Cancelled' && t.dueDate===tISO);
  const dueTomorrow = scopeTasks.filter(t => t.status!=='Completed' && t.status!=='Cancelled' && t.dueDate===tmwISO);
  const dueSoon = scopeTasks.filter(t => t.status!=='Completed' && t.status!=='Cancelled' && t.dueDate>=soonStart && t.dueDate<=soonEnd);
  const overdue = scopeTasks.filter(isOverdue);
  const critical = scopeTasks.filter(t => t.priority==='Critical' && t.status!=='Completed' && t.status!=='Cancelled');
  const unassigned = scopeTasks.filter(t => !t.assignedTo && t.status!=='Cancelled');
  const pendingApproval = scopeTasks.filter(t => t.status==='Pending Approval');
  return { dueToday, dueTomorrow, dueSoon, overdue, critical, unassigned, pendingApproval };
}

/* ---------- admin-sent notifications ---------- */
function notificationsForUser(u){
  return DB.notifications.filter(n => n.recipientId === null || n.recipientId === u.id)
    .slice().sort((a,b) => a.createdAt < b.createdAt ? 1 : -1);
}
function isNotificationRead(n, u){
  return DB.notificationReads.some(r => r.notificationDbId === n.dbId && r.employeeId === u.id);
}
function unreadNotificationCount(u){
  return notificationsForUser(u).filter(n => !isNotificationRead(n, u)).length;
}
function openNotification(id){
  const n = DB.notifications.find(x => x.id === id);
  if (!n) return;
  DB.markNotificationRead(n.dbId, currentUser().id);
  render();
}

function normalizeCode(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

  state.view = 'dashboard';

function submitAccessCode(){
  const raw = document.getElementById('access-code-input').value;
  state.accessAttempt = raw;
  const emp = DB.employees.find(e => e.active && normalizeCode(e.token) === normalizeCode(raw));
  if (!emp){ state.accessError = true; render(); return; }
  state.currentUserId = emp.id;
  state.locked = !emp.superAdmin;
  state.accessError = false;
  resetSessionState();
  try { localStorage.setItem('tf_access_code', emp.token); } catch(e){}
  requestNotificationPermission();
  render();
}
function signOut(){
  state.currentUserId = null;
  state.accessAttempt = '';
  state.accessError = false;
  state.authMode = 'code';
  state.emailAttempt = '';
  state.emailLinkSent = false;
  state.emailError = null;
  resetSessionState();
  try { localStorage.removeItem('tf_access_code'); } catch(e){}
  sb.auth.signOut().catch(function(){});
  render();
}

async function sendMagicLink(){
  const email = (document.getElementById('email-input').value || '').trim().toLowerCase();
  state.emailAttempt = email;
  if (!email){ state.emailError = 'Enter your email address.'; render(); return; }
  const emp = DB.employees.find(e => e.active && e.email && e.email.toLowerCase() === email);
  if (!emp){ state.emailError = "That email isn't on file — check with your manager."; render(); return; }
  state.emailError = null;
  state.emailSending = true;
  render();
  const redirectTo = window.location.origin + window.location.pathname;
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: redirectTo } });
  state.emailSending = false;
  if (error){ state.emailError = 'Could not send the link: ' + (error.message || 'unknown error') + (error.status ? ' (status ' + error.status + ')' : ''); render(); return; }
  state.emailLinkSent = true;
  render();
}

const KPI_ICON_MAP = [[/urgent/i,'alert','bad'], [/overdue/i,'alert','bad'], [/completed/i,'check','good'], [/progress/i,'clock','warn'], [/pending/i,'clock','warn'], [/efficiency/i,'chart','accent'], [/assigned|total/i,'list','accent']];
function kpiTile(label, value, foot, cls, trend, onclick){
  const match = KPI_ICON_MAP.find(m => m[0].test(label));
  const iconName = match ? match[1] : 'list';
  const colorVar = match ? match[2] : 'accent';
  const trendHtml = (trend!=null && isFinite(trend)) ? '<span class="kpi-trend '+(trend>=0?'up':'down')+'">'+icon(trend>=0?'arrowup':'arrowdown',9)+' '+Math.abs(trend)+'%</span>' : '';
  return '<div class="card kpi"'+(onclick?' style="cursor:pointer" onclick="'+onclick+'"':'')+'>' +
    '<div class="kpi-top"><div class="kpi-ico" style="background:var(--'+colorVar+'-soft);color:var(--'+colorVar+(colorVar==='accent'?'-strong':'')+')">'+icon(iconName,16)+'</div>'+trendHtml+'</div>' +

    (foot?'<div class="kpi-foot">'+foot+'</div>':'') +

}
function scoreRing(score, size){
  size = size || 64;
  const r = (size/2) - 5, c = 2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, score))/100;
  const color = score>=80 ? 'var(--good)' : score>=60 ? 'var(--accent)' : score>=40 ? 'var(--warn)' : 'var(--bad)';
  return '<div class="score-ring" style="width:'+size+'px;height:'+size+'px">' +
    '<svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="5"/>' +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct))+'"/></svg>' +
    '<div class="val">'+Math.round(score)+'</div></div>';
}
function breakdownRow(label, value, weightLabel){
  const pct = Math.max(0,Math.min(100,value));
  const color = pct>=80?'var(--good)':pct>=60?'var(--accent)':pct>=40?'var(--warn)':'var(--bad)';

    '<span class="bar-track"><span class="bar-fill" style="width:'+pct+'%;background:'+color+'"></span></span>' +
    '<span class="v num">'+Math.round(value)+'%</span></div>';
}

function workHoursFor(t){
  if (!t.startTime || !t.endTime) return null;
  const [sh,sm] = t.startTime.split(':').map(Number);
  const [eh,em] = t.endTime.split(':').map(Number);
  const hrs = (eh*60+em - (sh*60+sm)) / 60;
  return hrs > 0 ? hrs : null;
}
function fmtTimeRange(t){
  function fmt12(hm){
    const [h,m] = hm.split(':').map(Number);
    const ap = h>=12 ? 'PM' : 'AM';
    const h12 = h%12===0 ? 12 : h%12;
    return h12 + ':' + pad2(m) + ' ' + ap;
  }
  return fmt12(t.startTime) + ' – ' + fmt12(t.endTime);
}

/* ---------- My Day — urgent-first smart ordering (sections 43/44) ---------- */
function myDayBuckets(taskList){
  const pool = taskList.filter(t => t.status!=='Completed' && t.status!=='Cancelled');
  const used = new Set();
  function take(pred){ const list = pool.filter(t => !used.has(t.id) && pred(t)); list.forEach(t=>used.add(t.id)); return list; }
  const byDue = (a,b)=> a.dueDate<b.dueDate?-1:(a.dueDate>b.dueDate?1:0);
  const urgent = take(t=>t.isUrgent).sort(byDue);
  const fixed = take(t=>t.scheduleType==='fixed').sort(byDue);
  const overdue = take(isOverdue).sort(byDue);
  const dueToday = take(t=>t.dueDate===todayISO()).sort(byDue);
  const highPriority = take(t=>t.priority==='Critical'||t.priority==='High').sort(byDue);
  const lowPriority = take(t=>t.priority==='Low').sort(byDue);
  const planned = take(()=>true).sort((a,b) => {
    if (a.dailySequence!=null && b.dailySequence!=null) return a.dailySequence-b.dailySequence;
    if (a.dailySequence!=null) return -1;
    if (b.dailySequence!=null) return 1;
    return byDue(a,b);
  });
  return [
    {key:'urgent', label:'🔴 Urgent', list:urgent, draggable:false},
    {key:'fixed', label:'📌 Fixed / Meetings', list:fixed, draggable:false},
    {key:'overdue', label:'⚠️ Overdue', list:overdue, draggable:false},
    {key:'duetoday', label:'Due Today', list:dueToday, draggable:false},
    {key:'highpriority', label:'High Priority', list:highPriority, draggable:false},
    {key:'planned', label:'Planned Work', list:planned, draggable:true},
    {key:'lowpriority', label:'Low Priority', list:lowPriority, draggable:false}
  ];
}
function myDayDragStart(ev, taskId){ ev.dataTransfer.setData('text/plain', taskId); }
function myDayDrop(ev, targetTaskId){
  ev.preventDefault();
  const draggedId = ev.dataTransfer.getData('text/plain');
  if (!draggedId || draggedId === targetTaskId) return;
  const u = currentUser();
  const planned = myDayBuckets(DB.tasks.filter(t=>t.assignedTo===u.id)).find(b=>b.key==='planned').list;
  const ids = planned.map(t=>t.id);
  const from = ids.indexOf(draggedId), to = ids.indexOf(targetTaskId);
  if (from===-1 || to===-1) return;
  ids.splice(to, 0, ids.splice(from,1)[0]);
  ids.forEach((taskId, i) => DB.updateTask(taskId, { dailySequence: (i+1)*10 }));
  showToast('Schedule manually adjusted');
  render();
}

function timeAgo(iso){
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins+' min'+(mins===1?'':'s')+' ago';
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs+' hour'+(hrs===1?'':'s')+' ago';
  const days = Math.floor(hrs/24);
  if (days < 7) return days+' day'+(days===1?'':'s')+' ago';
  return fmtDateShort(iso.slice(0,10));
}
function miniMonthCalendar(year, month, taskList){
  const dueMap = {};
  taskList.forEach(t => { if (t.status!=='Cancelled'){ (dueMap[t.dueDate]=dueMap[t.dueDate]||[]).push(t); } });
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = todayISO();
  let cells = '';
  for (let i=0;i<firstDow;i++) cells += '<div class="mini-cal-cell empty"></div>';
  for (let d=1; d<=daysInMonth; d++){
    const iso = year+'-'+pad2(month+1)+'-'+pad2(d);
    const list = dueMap[iso];
    const isToday = iso===todayStr;
    const dotColor = list ? (list.some(isOverdue) ? 'var(--bad)' : 'var(--accent)') : '';
    cells += '<div class="mini-cal-cell'+(isToday?' today':'')+'" onclick="setView(\'calendar\')">'+d+(list?'<span class="mini-cal-dot" style="background:'+dotColor+'"></span>':'')+'</div>';
  }
  return '<div class="mini-cal-head-row"><span class="card-title">'+monthLabel(year,month)+'</span></div>' +
    '<div class="mini-cal-grid">' + ['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>'<div class="mini-cal-dow">'+d+'</div>').join('') + cells + '</div>';
}
function myProjectsProgress(taskList){
  const names = taskList.map(t=>t.project).filter((p,i,arr)=>arr.indexOf(p)===i);
  const rows = names.map(p => {
    const list = taskList.filter(t=>t.project===p && t.status!=='Cancelled');
    const completed = list.filter(t=>t.status==='Completed').length;
    return { name:p, total:list.length, completed, pct: list.length ? Math.round(completed/list.length*100) : 0 };
  }).filter(r=>r.total>0).sort((a,b)=>b.total-a.total).slice(0,5);
  if (!rows.length) return '<div class="empty-state">No projects yet.</div>';
  return rows.map(r => '<div class="proj-bar-row" onclick="setTaskFilter(\'project\',\''+escAttr(r.name).replace(/'/g,"\\'")+'\');setView(\'mytasks\')">' +

}

  const top = items.slice(0, limit||6);

  const verb = { completion:'marked complete', approval:'reviewed', request:'requested resources on', comment:'commented on' };

function filterTasks(base, scope){
  const f = state.taskFilters, tISO = todayISO();
  let list = base.slice();
  // My Tasks is meant to show active work only — completed tasks live in
  // their own "Completed Work" bucket further down the page instead.
  if (scope === 'my') list = list.filter(t => t.status !== 'Completed');
  if (f.quick === 'Today') list = list.filter(t => t.dueDate===tISO && t.status!=='Cancelled');
  else if (f.quick === 'Tomorrow') list = list.filter(t => t.dueDate===addDaysISO(tISO,1) && t.status!=='Cancelled');
  else if (f.quick === 'Due Soon') list = list.filter(t => t.dueDate>=addDaysISO(tISO,2) && t.dueDate<=addDaysISO(tISO,3) && t.status!=='Cancelled');
  else if (f.quick === 'This Week') list = list.filter(t => t.dueDate>=tISO && t.dueDate<=addDaysISO(tISO,7) && t.status!=='Cancelled');
  else if (f.quick === 'Overdue') list = list.filter(isOverdue);
  else if (f.quick === 'High Priority') list = list.filter(t => t.priority==='High');
  else if (f.quick === 'Critical') list = list.filter(t => t.priority==='Critical');
  else if (f.quick === 'Urgent') list = list.filter(t => t.isUrgent);
  else if (f.quick === 'Completed') list = list.filter(t => t.status==='Completed');
  if (f.status !== 'All') list = list.filter(t => t.status===f.status);
  if (f.dept !== 'All') list = list.filter(t => t.department===f.dept);
  if (f.project !== 'All') list = list.filter(t => t.project===f.project);
  if (f.priority !== 'All') list = list.filter(t => t.priority===f.priority);
  if (f.level !== 'All') list = list.filter(t => t.level===Number(f.level));
  if (scope === 'all'){
    if (f.employee === 'Unassigned') list = list.filter(t => !t.assignedTo);
    else if (f.employee !== 'All') list = list.filter(t => t.assignedTo===f.employee);
  }
  const q = state.search.trim().toLowerCase();
  if (q){
    list = list.filter(t => {
      const emp = DB.employees.find(e=>e.id===t.assignedTo);
      return (t.name+' '+t.id+' '+t.project+' '+t.department+' '+(emp?emp.name:'')).toLowerCase().includes(q);
    });
  }
  const {field, dir} = state.taskSort;
  list.sort((a,b) => {
    let av, bv;
    if (field==='priority'){ av=PRIORITY_RANK[a.priority]; bv=PRIORITY_RANK[b.priority]; }
    else if (field==='level'){ av=a.level; bv=b.level; }
    else if (field==='status'){ av=STATUS_RANK[a.status]; bv=STATUS_RANK[b.status]; }
    else if (field==='project'){ av=a.project; bv=b.project; }
    else { av=a.dueDate; bv=b.dueDate; }
    if (av<bv) return dir==='asc'?-1:1;
    if (av>bv) return dir==='asc'?1:-1;
    return 0;
  });
  return list;
}

function teamTimelineView(filtered){
  if (!filtered.length) return '<div class="empty-state">No tasks match the current filters.</div>';
  const starts = filtered.map(t=>parseISO(t.startDate).getTime());
  const ends = filtered.map(t=>parseISO(t.dueDate).getTime());
  const min = Math.min(...starts), max = Math.max(...ends);
  const span = Math.max(1, max-min);
  const rows = filtered.slice().sort((a,b)=>a.startDate<b.startDate?-1:1).slice(0,40);
  return '<div class="card card-pad">' +
    '<div class="sub" style="margin-bottom:10px">'+fmtDateShort(toISO(new Date(min)))+' → '+fmtDateShort(toISO(new Date(max)))+'</div>' +
    rows.map(t => {
      const s = parseISO(t.startDate).getTime(), e = parseISO(t.dueDate).getTime();
      const left = (s-min)/span*100, width = Math.max(1.5,(e-s)/span*100);
      const color = isOverdue(t) ? 'var(--bad)' : t.status==='Completed' ? 'var(--good)' : 'var(--accent)';
      return '<div class="timeline-row">' +
        '<span style="width:170px;flex:0 0 auto" class="ellipsis"><span class="task-name-cell" style="font-size:12px" onclick="openTaskDetail(\''+t.id+'\')">'+escHtml(t.name)+'</span></span>' +
        '<span class="timeline-track"><span class="timeline-bar" style="left:'+left+'%;width:'+width+'%;background:'+color+'" title="'+fmtDateShort(t.startDate)+' – '+fmtDateShort(t.dueDate)+'"></span></span>' +
        '<span style="width:90px;flex:0 0 auto;text-align:right" class="sub num">'+fmtDateShort(t.dueDate)+'</span>' +
      '</div>';
    }).join('') +
  '</div>';
}

function kanbanDragOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add('dragover'); }
function kanbanDragLeave(ev){ ev.currentTarget.classList.remove('dragover'); }
function kanbanDrop(ev, status){
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  const taskId = ev.dataTransfer.getData('text/plain');
  const t = DB.tasks.find(x => x.id===taskId);
  if (!t || !canUpdateProgress(t)) return;
  if (status === 'Completed'){ state.modal = { type:'taskDetail', taskId, showCompletionPrompt:true, showRejectPrompt:false }; render(); return; }
  if (status === 'Pending Approval'){ showToast('Open the task and submit for approval from there'); return; }
  const patch = { status };
  if (status === 'Not Started') patch.progress = 0;
  if ((t.status === 'Completed' || t.status === 'Pending Approval') && status !== 'Completed') patch.completionDate = null;
  DB.updateTask(taskId, patch);
  render();
}

function calNav(dir){
  const c = state.calendar;
  if (c.mode === 'month'){ const np = dir<0?prevMonth(c.y,c.m):nextMonth(c.y,c.m); c.y=np.y; c.m=np.m; }
  else if (c.mode === 'week') c.day = addDaysISO(c.day, dir*7);
  else c.day = addDaysISO(c.day, dir);
  render();
}
function calToday(){ state.calendar.y = today0.getFullYear(); state.calendar.m = today0.getMonth(); state.calendar.day = todayISO(); render(); }
function calSetMode(mode){ state.calendar.mode = mode; render(); }

function calTaskChip(t, kind){
  const overdue = isOverdue(t);
  let bg = 'var(--accent-soft)', color = 'var(--accent-strong)';
  if (kind === 'start'){ bg='var(--surface-2)'; color='var(--ink-soft)'; }
  else if (overdue){ bg='var(--bad-soft)'; color='var(--bad)'; }
  else if (t.priority==='Critical'){ bg='var(--bad-soft)'; color='var(--bad)'; }
  else if (t.priority==='High'){ bg='var(--warn-soft)'; color='var(--warn)'; }
  return '<div class="cal-task" style="background:'+bg+';color:'+color+'" onclick="openTaskDetail(\''+t.id+'\')" title="'+escAttr(t.name)+'">'+(kind==='start'?'▸ ':'')+escHtml(t.name)+'</div>';
}
function calendarMonthGrid(y, m, scope){
  const first = new Date(y, m, 1);
  const startOffset = first.getDay();
  const cellsStart = new Date(y, m, 1 - startOffset);
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = '<div class="cal-wrap"><div class="cal-grid">' + dow.map(dname => '<div class="cal-dow">'+dname+'</div>').join('');
  for (let i=0;i<42;i++){
    const cellDate = new Date(cellsStart); cellDate.setDate(cellsStart.getDate()+i);
    const iso = toISO(cellDate);
    const inMonth = cellDate.getMonth() === m;
    const isToday = iso === todayISO();
    const dueTasks = scope.filter(t => t.dueDate===iso && t.status!=='Cancelled');
    const startTasks = scope.filter(t => t.startDate===iso && t.startDate!==t.dueDate && t.status!=='Cancelled');
    html += '<div class="cal-cell '+(inMonth?'':'muted-cell')+' '+(isToday?'today':'')+'">' +
      '<div class="cal-daynum">'+cellDate.getDate()+'</div>' +
      dueTasks.slice(0,3).map(t => calTaskChip(t,'due')).join('') +
      (dueTasks.length>3 ? '<div class="sub" style="margin-top:2px">+'+(dueTasks.length-3)+' more</div>' : '') +
      startTasks.slice(0,1).map(t => calTaskChip(t,'start')).join('') +
    '</div>';
  }
  html += '</div></div>';
  return html;
}
function calendarWeekAgenda(startDate, scope){
  let html = '<div class="cal-wrap"><div class="grid" style="grid-template-columns:repeat(7,minmax(150px,1fr));min-width:840px">';
  for (let i=0;i<7;i++){
    const dt = new Date(startDate); dt.setDate(startDate.getDate()+i);
    const iso = toISO(dt);
    const isToday = iso === todayISO();
    const dayTasks = scope.filter(t => (t.dueDate===iso || t.startDate===iso) && t.status!=='Cancelled');
    html += '<div class="card card-pad" style="min-height:150px;min-width:0;overflow:hidden;'+(isToday?'border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)':'')+'">' +
      '<div style="font-weight:800;font-size:12px;margin-bottom:6px">'+dt.toLocaleDateString('en-US',{weekday:'short'})+' '+dt.getDate()+'</div>' +
      (dayTasks.length ? dayTasks.map(t => calTaskChip(t, t.dueDate===iso?'due':'start')).join('') : '<div class="sub">—</div>') +
    '</div>';
  }
  html += '</div></div>';
  return html;
}
function calendarDayAgenda(iso, scope){
  const dayTasks = scope.filter(t => (t.dueDate===iso || t.startDate===iso) && t.status!=='Cancelled');
  if (!dayTasks.length) return '<div class="empty-state">No tasks scheduled for this day.</div>';
  return '<div class="table-wrap"><table><thead><tr><th>Task</th><th>Employee</th><th>Project</th><th>Priority</th><th>Level</th><th>Type</th><th>Status</th></tr></thead><tbody>' +
    dayTasks.map(t => {
      const emp = DB.employees.find(e=>e.id===t.assignedTo);
      const type = (t.dueDate===iso?'Due':'') + (t.startDate===iso ? (t.dueDate===iso?' / Start':'Start') : '');
      return '<tr class="row"><td class="task-name-cell" onclick="openTaskDetail(\''+t.id+'\')">'+t.name+'</td><td>'+(emp?emp.name:'<span class="muted">Unassigned</span>')+'</td><td>'+t.project+'</td><td>'+priorityPill(t.priority)+'</td><td>'+levelBars(t.level)+'</td><td class="sub">'+type+'</td><td>'+statusPill(t)+'</td></tr>';
    }).join('') +
  '</tbody></table></div>';
}
function viewCalendar(u){
  const c = state.calendar;
  const scope = isAdmin() ? visibleTasks() : DB.tasks.filter(t => t.assignedTo===u.id);
  let label, body;
  if (c.mode === 'month'){ label = monthLabel(c.y,c.m); body = calendarMonthGrid(c.y,c.m,scope); }
  else if (c.mode === 'week'){ const start = startOfWeek(parseISO(c.day)); label = fmtDateShort(toISO(start))+' – '+fmtDateShort(addDaysISO(toISO(start),6))+', '+start.getFullYear(); body = calendarWeekAgenda(start,scope); }
  else { label = fmtDate(c.day); body = calendarDayAgenda(c.day, scope); }

  return '<div class="page-head"><div><div class="page-title">Calendar</div><div class="page-sub">Tasks placed by start and due date</div></div>' +
    '<div class="page-actions">' +
      ['month','week','day'].map(mo => '<button class="btn btn-sm '+(c.mode===mo?'btn-primary':'')+'" onclick="calSetMode(\''+mo+'\')">'+mo.charAt(0).toUpperCase()+mo.slice(1)+'</button>').join('') +
    '</div></div>' +
    '<div class="flex-between" style="margin-bottom:12px;flex-wrap:wrap;gap:10px">' +
      '<div class="flex gap-8"><button class="btn btn-sm btn-ghost" onclick="calNav(-1)">'+icon('chevronleft',13)+'</button><button class="btn btn-sm btn-ghost" onclick="calToday()">Today</button><button class="btn btn-sm btn-ghost" onclick="calNav(1)">'+icon('chevronright',13)+'</button></div>' +
      '<div style="font-weight:800;font-size:14.5px">'+label+'</div>' +
      '<div class="flex gap-8"><span class="pill pill-critical">Critical / Overdue</span><span class="pill pill-high">High Priority</span></div>' +
    '</div>' +
    '<div class="card card-pad">'+body+'</div>';
}

  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(token).then(() => showToast('Code copied')).catch(() => showToast('Copy failed — select the code and copy manually'));
  } else {
    showToast('Copy not supported here — select the code and copy manually');
  }
}

/* =====================================================================
   17. MODALS — task form, task detail, employee form, employee detail
   ===================================================================== */
function renderModal(){
  const m = state.modal;
  if (m.type === 'taskForm') return renderTaskFormModal(m.taskId);
  if (m.type === 'taskDetail') return renderTaskDetailModal(m.taskId);
  if (m.type === 'employeeForm') return renderEmployeeFormModal(m.empId);
  if (m.type === 'employeeDetail') return renderEmployeeDetailModal(m.empId);
  if (m.type === 'sendNotification') return renderSendNotificationModal();
  if (m.type === 'resourceRequest') return renderResourceRequestModal(m.taskId);
  return '';
}

function openSendNotification(){ state.notifOpen = false; state.modal = { type:'sendNotification' }; render(); }
function renderSendNotificationModal(){

async function submitSendNotification(){
  const title = document.getElementById('sn-title').value.trim();
  const body = document.getElementById('sn-body').value.trim();
  const recipient = document.getElementById('sn-recipient').value || null;
  if (!title){ showToast('Title is required'); return; }
  try {
    await DB.addNotification({ senderId: currentUser().id, recipientId: recipient, type:'admin', title, body });
